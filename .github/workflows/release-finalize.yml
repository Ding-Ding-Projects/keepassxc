name: Finalize Squirrel release timing

on:
  workflow_run:
    workflows: [Material Squirrel Build and Release]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-finalizer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the committed finalizer from the default jer
        uses: actions/checkout@v4

      - name: Finalize exact publication timing and latest release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/finalize-release.mjs --finalize
