name: Material Squirrel Build and Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Package unsigned Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 180
    outputs:
      package-version: ${{ steps.package_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify Changelog provenance history
        shell: powershell
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $shallow = (& git rev-parse --is-shallow-repository).Trim()
          if ($LASTEXITCODE -ne 0 -or $shallow -ne 'false') { throw "Release checkout is shallow: $shallow" }
          $tags = @(git tag --list)
          if ($LASTEXITCODE -ne 0 -or $tags.Count -eq 0) { throw 'Release checkout contains no historical tags.' }
          foreach ($tag in $tags) {
            $commit = (& git rev-parse --verify "$tag^{commit}" 2>$null).Trim()
            if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') {
              throw "Historical tag cannot resolve to a commit object: $tag"
            }
            & git cat-file -e "$commit^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) { throw "Historical commit object is missing for tag: $tag" }
          }
          Write-Host "Verified $($tags.Count) historical tag commit object(s)."

      - name: Install pinned Qt 6.8.3 for MSVC 2022 x64
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.temp }}\Qt
          cache: true
          set-env: true

      - name: Verify and export the installed Qt root
        shell: powershell
        run: |
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot) {
            $deployTools = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'Qt') -Filter windeployqt.exe -File -Recurse)
            if ($deployTools.Count -ne 1) { throw "Expected one windeployqt.exe under the pinned Qt installation; found $($deployTools.Count)." }
            $qtRoot = Split-Path -Parent (Split-Path -Parent $deployTools[0].FullName)
          }
          $qtRoot = [IO.Path]::GetFullPath($qtRoot)
          $qmake = Join-Path $qtRoot 'bin\qmake.exe'
          $windeployqt = Join-Path $qtRoot 'bin\windeployqt.exe'
          if (-not (Test-Path -LiteralPath $qmake -PathType Leaf)) { throw "Pinned qmake.exe is missing from $qtRoot." }
          if (-not (Test-Path -LiteralPath $windeployqt -PathType Leaf)) { throw "Pinned windeployqt.exe is missing from $qtRoot." }
          $qtVersion = (& $qmake -query QT_VERSION).Trim()
          $qtSpec = (& $qmake -query QMAKE_XSPEC).Trim()
          if ($LASTEXITCODE -ne 0 -or $qtVersion -ne '6.8.3') { throw "Expected Qt 6.8.3; qmake reported '$qtVersion'." }
          if ($qtSpec -notmatch 'win32-msvc') { throw "Expected the MSVC Qt build; qmake reported '$qtSpec'." }
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $qtBin = Join-Path $qtRoot 'bin'
          $qtBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "QT_ROOT_DIR=$qtRoot"

      - name: Export the MSVC 2022 x64 environment
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'vswhere.exe is unavailable.' }
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'No Visual Studio installation with the MSVC x64 toolchain was found.' }
          $vcvars = Join-Path $vsRoot 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) { throw "vcvars64.bat is missing from $vsRoot." }
          cmd.exe /d /s /c "call `"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([A-Za-z_][A-Za-z0-9_()\[\]]*)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat exited with $LASTEXITCODE." }

      - name: Verify the Squirrel-only packaging boundary
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-squirrel-only-packaging.ps1

      - name: Resolve the monotonic package version
        id: package_version
        shell: powershell
        run: |
          $ordinal = ([int64]'${{ github.run_number }}' * 100) + [int64]'${{ github.run_attempt }}'
          $patch = $ordinal % 65536
          $minorOrdinal = 8 + [Math]::Floor($ordinal / 65536)
          $minor = $minorOrdinal % 65536
          $major = 2 + [Math]::Floor($minorOrdinal / 65536)
          $packageVersion = "$major.$minor.$patch"
          "value=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Package version: $packageVersion"

      - name: Build the unsigned Squirrel.Windows installer
        shell: cmd
        run: build-installer.bat /s -Version ${{ steps.package_version.outputs.value }}

      - name: Collect required Squirrel.Windows artifacts
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'dist\squirrel-windows'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $required = @('Setup.exe', 'RELEASES', 'artifact-receipt.json', 'build-provenance.json', 'update-manifest-v1.json')
          foreach ($name in $required) {
            $path = Join-Path $source $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required Squirrel artifact is missing: $name" }
            Copy-Item -LiteralPath $path -Destination $destination
          }
          $full = @(Get-ChildItem -LiteralPath $source -Filter '*-full.nupkg' -File)
          if ($full.Count -ne 1) { throw "Expected exactly one full Squirrel package; found $($full.Count)." }
          Copy-Item -LiteralPath $full[0].FullName -Destination $destination
          Get-ChildItem -LiteralPath $source -Filter '*-delta.nupkg' -File | Copy-Item -Destination $destination

      - name: Upload safe package evidence even when packaging fails
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: package-windows-x64-${{ github.run_id }}
          path: |
            artifacts/Setup.exe
            artifacts/RELEASES
            artifacts/*.nupkg
            artifacts/artifact-receipt.json
            artifacts/build-provenance.json
            artifacts/update-manifest-v1.json
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish Squirrel.Windows release
    needs: [package-windows]
    if: >-
      success()
      && (github.event_name == 'workflow_dispatch'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout the released commit for release evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          path: source

      - name: Set up Node for the committed line counter
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the verified package
        uses: actions/download-artifact@v8
        with:
          name: package-windows-x64-${{ github.run_id }}
          path: artifacts

      - name: Count the released commit's lines with the committed counter
        shell: bash
        run: |
          set -euo pipefail
          (cd source && node scripts/count-lines.mjs) > line-count.md
          test -s line-count.md

      - name: Select the dim sum code name and photo from the public catalog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Every release takes the next unused dish from the public catalog, in
          # catalog order, and only a dish whose photo is published. The mapping
          # is auditable from prior release bodies, which each record their dish id.
          node source/scripts/select-dim-sum.mjs --used-from-releases --out dim-sum.json
          cat dim-sum.json
          asset_url=$(node -e "console.log(require('./dim-sum.json').assetUrl)")
          asset_name=$(node -e "console.log(require('./dim-sum.json').assetName)")
          curl -fsSL --retry 3 -o "artifacts/${asset_name}" "$asset_url"
          # The image must decode as a PNG before it can be attached.
          node -e "const b=require('fs').readFileSync('artifacts/${asset_name}');if(b.length<8||b.readUInt32BE(0)!==0x89504e47)process.exit(1)"
          echo "DIM_SUM_ASSET=${asset_name}" >> "$GITHUB_ENV"
          echo "DIM_SUM_TITLE=$(node -e "const d=require('./dim-sum.json');console.log(d.nameEn+' - '+d.nameZh)")" >> "$GITHUB_ENV"
          echo "DIM_SUM_ID=$(node -e "console.log(require('./dim-sum.json').id)")" >> "$GITHUB_ENV"
          echo "DIM_SUM_PHOTO_URL=${asset_url}" >> "$GITHUB_ENV"

      - name: Measure end-to-end workflow timing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # From the first job's real start to this step, which is the publication
          # boundary. A missing value fails here rather than becoming an estimate.
          started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '[.jobs[].started_at] | sort | .[0]')
          test -n "$started" && test "$started" != "null"
          completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          seconds=$(( $(date -u -d "$completed" +%s) - $(date -u -d "$started" +%s) ))
          printf -v duration '%02d:%02d:%02d' $((seconds/3600)) $((seconds%3600/60)) $((seconds%60))
          echo "WORKFLOW_STARTED=${started}" >> "$GITHUB_ENV"
          echo "WORKFLOW_COMPLETED=${completed}" >> "$GITHUB_ENV"
          echo "WORKFLOW_DURATION=${duration}" >> "$GITHUB_ENV"

      - name: Verify required release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/Setup.exe
          test -s artifacts/RELEASES
          test -s artifacts/artifact-receipt.json
          test -s artifacts/build-provenance.json
          test -s artifacts/update-manifest-v1.json
          shopt -s nullglob
          full=(artifacts/*-full.nupkg)
          test ${#full[@]} -eq 1

      - name: Compose release notes
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.package-windows.outputs.package-version }}
          RELEASE_TAG: v${{ needs.package-windows.outputs.package-version }}
        run: |
          set -euo pipefail
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          cat > release-notes.md <<EOF
          KeePassXC Material ${PACKAGE_VERSION} is an automated unsigned Windows x64 build of \`${GITHUB_SHA}\` from \`${GITHUB_REF_NAME}\`.

          This release uses Squirrel.Windows exclusively. \`Setup.exe\` may trigger Windows Unknown Publisher or SmartScreen warnings because code signing is permanently disabled.

          Required assets: \`Setup.exe\`, \`RELEASES\`, one full \`.nupkg\`, build provenance, artifact receipt, and the versioned update manifest. Delta packages are attached when Squirrel can produce them from a compatible previous full package.

          No tests or lint run in GitHub Actions. Local verification is reported separately from this packaging and publication workflow.

          Code name: **${DIM_SUM_TITLE}** (\`${DIM_SUM_ID}\`, [public photo](${DIM_SUM_PHOTO_URL}), attached as \`${DIM_SUM_ASSET}\`). Code names come from the public dim-sum catalog and are used once per project.

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Workflow started: ${WORKFLOW_STARTED}
          Workflow completed: ${WORKFLOW_COMPLETED}
          Workflow duration: ${WORKFLOW_DURATION}

          ## Lines of code at \`${GITHUB_SHA}\`

          EOF
          cat line-count.md >> release-notes.md

      - name: Create the GitHub Release
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.package-windows.outputs.package-version }}
          RELEASE_TAG: v${{ needs.package-windows.outputs.package-version }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(artifacts/Setup.exe artifacts/RELEASES artifacts/*.nupkg artifacts/artifact-receipt.json artifacts/build-provenance.json artifacts/update-manifest-v1.json "artifacts/${DIM_SUM_ASSET}")
          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "KeePassXC Material ${PACKAGE_VERSION} - ${DIM_SUM_TITLE}" \
            --notes-file release-notes.md \
            --draft=false \
            --prerelease=false \
            "${assets[@]}"
