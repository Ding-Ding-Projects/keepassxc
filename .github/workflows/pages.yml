name: Publish the documentation site

# Publishes site/ to GitHub Pages on every push to the default branch. It runs no
# tests and no lint. A successful main-branch release refreshes verified links. The
# social preview image is copied beside the page so its og:image URL is served
# from the same origin the crawler fetches.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Material Squirrel Build and Release']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the locally bundled website
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          KPXC_REFRESH_RELEASE: '1'
        run: |
          npm ci --prefix site --ignore-scripts
          npm run build --prefix site

      - name: Assemble the site with its social preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp -R site/dist/. public/
          touch public/.nojekyll
          # The served copy must be byte-identical to the root master.
          cmp social-preview.png public/social-preview.png
          test -s public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
